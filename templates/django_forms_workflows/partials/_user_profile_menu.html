<!-- User Profile Dropdown Component -->
<div class="dropdown">
    <button class="btn btn-user-profile dropdown-toggle d-flex align-items-center" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="user-avatar me-2">
            <i class="bi bi-person-fill"></i>
        </div>
        <div class="user-meta d-none d-sm-flex flex-column text-start">
            <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
            <span class="user-role">{% if user.is_superuser %}Superuser{% elif user.is_staff %}Staff{% else %}Employee{% endif %}</span>
        </div>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm border border-light-subtle py-2 mt-2" aria-labelledby="userMenuDropdown" style="min-width: 220px; font-size: 13px;">
        <!-- Top section: User Info -->
        <li class="px-3 py-2 border-bottom border-light-subtle mb-1">
            <div class="fw-semibold text-dark">{{ user.get_full_name|default:user.username }}</div>
            <div class="text-muted small">{{ user.email|default:"User Account" }}</div>
        </li>

        {# Middle section: Admin Panel (Staff/Superusers only) #}
        {% if user.is_staff or user.is_superuser %}
        <li>
            <a class="dropdown-item py-2 d-flex align-items-center" href="{% url 'admin:index' %}">
                <i class="bi bi-gear me-2 text-secondary"></i>
                <span>Admin Panel</span>
            </a>
        </li>
        {% endif %}

        <!-- Divider -->
        <li><hr class="dropdown-divider my-1"></li>

        <!-- Bottom section: Logout -->
        <li>
            <a class="dropdown-item py-2 text-danger d-flex align-items-center" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i>
                <span>Logout</span>
            </a>
        </li>
    </ul>
</div>
